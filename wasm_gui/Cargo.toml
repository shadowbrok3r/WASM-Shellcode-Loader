[package]
name = "wasm_gui"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.33", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui_logger = "0.9"
simplelog = "0.12"
log = "0.4"
anyhow = "1"

[dependencies.egui]
version = "0.33"
default-features = false
features = ["rayon", "bytemuck", "serde"]
